[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpilot-mcp"
version = "2.0.0"
description = "A secure GitHub issue command center for Claude and teams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
  "python-dotenv==1.2.2",
  "starlette==1.6.0",
  "uvicorn==0.52.2",
  "itsdangerous==2.2.0",
  "cryptography==50.0.0",
  "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
gitpilot-dashboard = "dashboard:main"
gitpilot-doctor = "setup_doctor:main"

[tool.setuptools]
py-modules = ["dashboard", "server", "setup_doctor"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
